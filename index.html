<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#43594B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Muscu Fanny">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Carnet Muscu Fanny</title>
<style>
  :root{
    --green:#43594B; --green-soft:#5c7565; --bg:#F2F1F0; --card:#ffffff;
    --line:#e2e0dd; --ink:#20241f; --muted:#7c827a;
    --ok:#3a7d44; --ok-bg:#e7f2e8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    background:var(--green); color:#fff; padding:14px 16px;
    padding-top:calc(14px + env(safe-area-inset-top));
    position:sticky; top:0; z-index:30;
  }
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
  header .sub{font-size:12px;opacity:.85;margin-top:2px}
  .top-actions{display:flex;gap:8px;margin-top:10px}
  .top-actions button{
    flex:1;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);
    border-radius:10px;padding:9px;font-size:13px;font-weight:600;
  }
  .top-actions button:active{background:rgba(255,255,255,.28)}
  .tabs{
    display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--bg);
    position:sticky;top:0;z-index:20;-webkit-overflow-scrolling:touch;
    border-bottom:1px solid var(--line);
  }
  .tab{
    white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600;flex:0 0 auto;
  }
  .tab.active{background:var(--green);color:#fff;border-color:var(--green)}
  .tab-extra{border-style:dashed}
  .tab-extra.active{border-style:solid}
  main{padding:12px 12px 40px}
  .warm{
    background:#fff7e8;border:1px solid #f0dcae;border-radius:12px;padding:10px 12px;
    font-size:13px;color:#7a5a1e;margin-bottom:12px;
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px;margin-bottom:12px;
  }
  .ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .ex-name{font-size:16px;font-weight:700;line-height:1.2}
  .ex-target{font-size:12px;color:var(--muted);margin-top:3px}
  .ss-tag{
    display:inline-block;background:#eef2ef;color:var(--green);border-radius:6px;
    font-size:11px;font-weight:700;padding:2px 7px;margin-bottom:6px;
  }
  .cue{font-size:12px;color:var(--green-soft);background:#f3f6f3;border-radius:8px;padding:7px 9px;margin:8px 0}
  .last{
    font-size:12.5px;color:var(--muted);margin:8px 0 6px;
    background:#f6f5f3;border-radius:8px;padding:7px 9px;
  }
  .last b{color:var(--ink)}
  .unit-sel{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;background:#fff;color:var(--ink);font-weight:600}
  .sets{display:flex;flex-direction:column;gap:7px;margin-top:8px}
  .setrow{display:flex;align-items:center;gap:7px;padding:4px;border-radius:10px}
  .setrow.done{background:var(--ok-bg)}
  .setrow .n{width:18px;font-size:12px;color:var(--muted);font-weight:700;text-align:center;flex:0 0 auto}
  .field{flex:1;display:flex;flex-direction:column;min-width:0}
  .field label{font-size:10px;color:var(--muted);margin:0 0 2px 2px;text-transform:uppercase;letter-spacing:.4px}
  .field .unit-tag{font-size:9px}
  input[type=text],input[type=number]{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 8px;font-size:16px;
    background:#fff;color:var(--ink);
  }
  input:focus{outline:none;border-color:var(--green)}
  .tick{
    flex:0 0 auto;width:42px;height:42px;border-radius:10px;border:2px solid var(--line);
    background:#fff;color:transparent;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;
  }
  .tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .rm{background:none;border:none;color:#c25;font-size:20px;padding:0 2px;flex:0 0 auto}
  .card-actions{display:flex;gap:8px;margin-top:10px;align-items:center}
  .addset{background:#eef2ef;color:var(--green);border:none;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
  .save{background:var(--green);color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:700}
  .save:active{opacity:.85}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50;align-items:center;justify-content:center;padding:16px}
  .modal-bg.open{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
  .modal h2{margin:0;padding:14px 16px;font-size:16px;border-bottom:1px solid var(--line)}
  .modal textarea{flex:1;border:none;padding:14px 16px;font-size:13px;font-family:ui-monospace,Menlo,monospace;resize:none;min-height:220px}
  .modal .mact{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
  .modal .mact button{flex:1;border-radius:10px;padding:11px;font-size:14px;font-weight:700;border:none}
  .btn-primary{background:var(--green);color:#fff}
  .btn-ghost{background:#eef0ee;color:var(--ink)}
  textarea.note{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{font-size:11px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.5}
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--green);color:#fff;
    padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;
    pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.2)
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Carnet Muscu Fanny</h1>
  <div class="sub" id="subtitle">Programme Pareto, 4 séances / semaine</div>
  <div class="top-actions">
    <button id="btn-export">Exporter pour le coach</button>
    <button id="btn-reset">Effacer aujourd'hui</button>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>
<main id="main"></main>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h2>Récap pour le coach</h2>
    <textarea id="export-text" readonly></textarea>
    <div class="mact">
      <button class="btn-ghost" id="btn-close">Fermer</button>
      <button class="btn-primary" id="btn-share">Partager / Copier</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= Programme (fichier du coach) =================
   unit = unité par défaut de la machine : "kg" ou "lb". bw = poids de corps.
   hintKg = charge conseillée en kg (pour affichage + conversion lb). */
const CUE_BSS = "Buste penché ~45°, appui loin devant, charge sentie sur le talon arrière.";
const SS = "Superset (enchaîné)";

const PROGRAM = [
  { key:"HAUT_A", label:"Haut A", focus:"Épaules / posture",
    ex:[
      {id:"tirage_dos_assis", name:"Tirage dos assis (poulie)", sets:4, reps:"8", hint:"25 kg", hintKg:25, unit:"plaq", rest:"60s"},
      {id:"dev_epaules_arnold", name:"Développé épaules Arnold", sets:3, reps:"8", hint:"6 kg", hintKg:6, unit:"kg", rest:"60s"},
      {id:"pompes_inclinees", name:"Pompes (inclinées)", sets:3, reps:"6", hint:"PDC", unit:"pdc", rest:"60s"},
      {id:"face_pull", name:"Face pull ou oiseau (poulie)", sets:3, reps:"10", hint:"4 kg", hintKg:4, unit:"plaq", rest:"60s"},
      {id:"triceps_corde", name:"Triceps à la corde (poulie)", sets:2, reps:"14", hint:"4 kg", hintKg:4, unit:"plaq", rest:"45s"},
    ]},
  { key:"BAS_A", label:"Bas A", focus:"Fessiers, volume bilatéral",
    ex:[
      {id:"hip_thrust_barre", name:"Hip thrust barre / haltère", sets:4, reps:"8", hint:"5 kg", hintKg:5, unit:"kg", rest:"60s"},
      {id:"bulgarian_split_squat", name:"Bulgarian split squat", sets:3, reps:"7 / jambe", hint:"4 kg", hintKg:4, unit:"kg", rest:"60s", ss:SS, cue:CUE_BSS},
      {id:"bstance_rdl", name:"B-Stance RDL", sets:3, reps:"7", hint:"2 x 5 kg", hintKg:5, unit:"kg", rest:"60s", ss:SS},
      {id:"abduction_hanche", name:"Abduction de hanche à la poulie", sets:1, reps:"10", hint:"2 kg", hintKg:2, unit:"plaq", rest:"60s"},
      {id:"gainage_mains", name:"Gainage sur les mains", sets:3, reps:"30s", hint:"PDC", unit:"pdc", rest:"15s"},
    ]},
  { key:"HAUT_B", label:"Haut B", focus:"Tirer / posture",
    ex:[
      {id:"tirage_vertical", name:"Tirage vertical (poulie)", sets:3, reps:"10", hint:"20 kg", hintKg:20, unit:"plaq", rest:"90s"},
      {id:"low_row_uni", name:"Low row unilatéral", sets:3, reps:"10-12 / côté", hint:"6 kg", hintKg:6, unit:"kg", rest:"75s"},
      {id:"dev_couche", name:"Développé couché", sets:3, reps:"15", hint:"6 kg", hintKg:6, unit:"kg", rest:"90s"},
      {id:"elevations_laterales", name:"Élévations latérales", sets:3, reps:"14", hint:"4 kg", hintKg:4, unit:"kg", rest:"60s"},
      {id:"triceps_corde", name:"Triceps à la corde", sets:3, reps:"14", hint:"4 kg", hintKg:4, unit:"plaq", rest:"45s"},
      {id:"prone_ytw", name:"Prone Y-T-W / prone cobra", sets:3, reps:"12", hint:"PDC", unit:"pdc", rest:"45s"},
    ]},
  { key:"BAS_B", label:"Bas B", focus:"Fessiers, unilatéral",
    ex:[
      {id:"hip_thrust_uni", name:"Hip thrust barre - Unilatéral", sets:4, reps:"8 / jambe", hint:"PDC", unit:"pdc", rest:"60s"},
      {id:"bulgarian_split_squat", name:"Bulgarian split squat", sets:3, reps:"7 / jambe", hint:"4 kg", hintKg:4, unit:"kg", rest:"60s", ss:SS, cue:CUE_BSS},
      {id:"bstance_rdl", name:"B-Stance RDL", sets:3, reps:"7", hint:"2 x 5 kg", hintKg:5, unit:"kg", rest:"60s", ss:SS},
      {id:"abduction_hanche", name:"Abduction de hanche à la poulie", sets:1, reps:"10", hint:"2 kg", hintKg:2, unit:"plaq", rest:"60s"},
      {id:"gainage_mains", name:"Gainage sur les mains", sets:3, reps:"30s", hint:"PDC", unit:"pdc", rest:"15s"},
    ]},
];

const EX_NAME={}, EX_DEF={};
PROGRAM.forEach(s=>s.ex.forEach(e=>{ EX_NAME[e.id]=e.name; if(!EX_DEF[e.id]) EX_DEF[e.id]=e; }));
function defUnit(exId){ const e=EX_DEF[exId]; return e && e.unit ? e.unit : "kg"; }

const TABS = [{key:"HOME", label:"Accueil", home:true}]
  .concat(PROGRAM)
  .concat([
    {key:"BILAN",   label:"Bilan",   bilan:true},
    {key:"JOURNAL", label:"Journal", journal:true},
    {key:"PROGRES", label:"Progrès", progres:true},
    {key:"POIDS",   label:"Poids",   poids:true},
    {key:"MENS",    label:"Mensurations", mens:true},
  ]);

/* Muscle principal par exercice (pour le calcul séries/muscle/semaine) */
const MUSCLE={
  tirage_dos_assis:["Dos"], dev_epaules_arnold:["Épaules"], pompes_inclinees:["Pectoraux"],
  face_pull:["Épaules"], triceps_corde:["Triceps"], hip_thrust_barre:["Fessiers"],
  bulgarian_split_squat:["Fessiers"], bstance_rdl:["Ischios"], abduction_hanche:["Fessiers"],
  gainage_mains:["Gainage"], tirage_vertical:["Dos"], low_row_uni:["Dos"], dev_couche:["Pectoraux"],
  elevations_laterales:["Épaules"], prone_ytw:["Dos"], hip_thrust_uni:["Fessiers"],
};
const MUSCLE_ORDER=["Fessiers","Ischios","Dos","Épaules","Pectoraux","Triceps","Gainage"];
/* Objectif de séries/semaine par muscle (recommandation, ajustable avec le coach) */
const MUSCLE_TARGET={Fessiers:16, Ischios:8, Dos:12, "Épaules":10, Pectoraux:8, Triceps:6, Gainage:8};

/* Mensurations (cm) */
const MEAS_FIELDS=[
  {k:"poitrine",label:"Tour de poitrine"},
  {k:"epaule",label:"Tour d'épaule"},
  {k:"bras_g",label:"Bras gauche"},
  {k:"bras_d",label:"Bras droit"},
  {k:"taille",label:"Tour de taille"},
  {k:"hanche",label:"Tour de hanche"},
  {k:"cuisse_g",label:"Cuisse gauche"},
  {k:"cuisse_d",label:"Cuisse droite"},
  {k:"mollet_g",label:"Mollet gauche"},
  {k:"mollet_d",label:"Mollet droit"},
];

/* ================= Poids de corps : objectif aligné sur FAB Agent ================= */
const BW_START=71.5, BW_GOAL=63;
/* Suivi mensuel du poids (repris de FAB Agent, départ 71,5 début mars) */
const PM_KEY="muscu_fanny_poids_mensuel_v1";
const PM_DEFAULT=[
  {mois:"Début mars", poids:71.5},
  {mois:"23 mars", poids:69.9},
  {mois:"Avril", poids:69.5, estime:true},
  {mois:"Mai", poids:69.2, estime:true},
  {mois:"Juin", poids:68.5},
  {mois:"Juillet", poids:67.0},
];
const PM_PROJ=[
  {mois:"Août (objectif)", poids:65.8},
  {mois:"Septembre", poids:64.6},
  {mois:"Octobre", poids:63.4},
  {mois:"Novembre (objectif)", poids:63.0},
];

/* ================= Stockage ================= */
const STORE_KEY="muscu_fanny_v1";
function loadDB(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||{}; }catch(e){ return {}; } }
function saveDB(){ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
let DB=loadDB();

const UNITS_KEY="muscu_fanny_units_v1";
function loadUnits(){ try{ return JSON.parse(localStorage.getItem(UNITS_KEY))||{}; }catch(e){ return {}; } }
function saveUnits(){ localStorage.setItem(UNITS_KEY, JSON.stringify(UNITS)); }
let UNITS=loadUnits();
function unitOf(exId){ return UNITS[exId] || defUnit(exId); }

const NOTES_KEY="muscu_fanny_notes_v1";
function loadNotes(){ try{ return JSON.parse(localStorage.getItem(NOTES_KEY))||{}; }catch(e){ return {}; } }
function saveNotes(){ localStorage.setItem(NOTES_KEY, JSON.stringify(NOTES)); }
let NOTES=loadNotes();

const BW_KEY="muscu_fanny_bw_v1";
function loadBW(){ try{ return JSON.parse(localStorage.getItem(BW_KEY))||[]; }catch(e){ return []; } }
function saveBW(){ localStorage.setItem(BW_KEY, JSON.stringify(BW)); }
let BW=loadBW();

const MEAS_KEY="muscu_fanny_mens_v1";
function loadMeas(){ try{ return JSON.parse(localStorage.getItem(MEAS_KEY))||[]; }catch(e){ return []; } }
function saveMeas(){ localStorage.setItem(MEAS_KEY, JSON.stringify(MEAS)); }
let MEAS=loadMeas();

function loadPM(){ try{ const s=localStorage.getItem(PM_KEY); return s?JSON.parse(s):JSON.parse(JSON.stringify(PM_DEFAULT)); }catch(e){ return JSON.parse(JSON.stringify(PM_DEFAULT)); } }
function savePM(){ localStorage.setItem(PM_KEY, JSON.stringify(PM)); }
let PM=loadPM();

function isoOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDaysIso(iso,n){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return isoOf(d); }
function weekMonday(iso){ const d=new Date(iso+"T00:00:00"); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return isoOf(d); }
function weekSets(mondayIso){
  const end=addDaysIso(mondayIso,6); const c={}; MUSCLE_ORDER.forEach(m=>c[m]=0);
  Object.keys(DB).forEach(exId=>{ const ms=MUSCLE[exId]; if(!ms) return;
    (DB[exId]||[]).forEach(en=>{ if(en.date>=mondayIso && en.date<=end){ const n=(en.sets||[]).length; ms.forEach(m=>{ c[m]=(c[m]||0)+n; }); } });
  });
  return c;
}

/* Migration : les anciennes entrées sans unité prennent l'unité par défaut de l'exo. */
(function migrate(){
  let changed=false;
  Object.keys(DB).forEach(exId=>{
    (DB[exId]||[]).forEach(en=>{ if(!en.unit){ en.unit=defUnit(exId); changed=true; } });
  });
  if(changed) saveDB();
})();

/* ================= Utilitaires ================= */
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
const MOIS=["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"];
const MOIS_LONG=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
function frDateLong(iso){ const d=new Date(iso+"T00:00:00"); return JOURS[d.getDay()]+" "+parseInt(iso.split("-")[2],10)+" "+MOIS_LONG[d.getMonth()]; }
function frDate(iso){ const [y,m,d]=iso.split("-"); return parseInt(d,10)+" "+MOIS[parseInt(m,10)-1]+" "+y; }
function frShort(iso){ const [y,m,d]=iso.split("-"); return parseInt(d,10)+" "+MOIS[parseInt(m,10)-1]; }
function daysAgo(iso){ const a=new Date(iso+"T00:00:00"), b=new Date(todayStr()+"T00:00:00"); const n=Math.round((b-a)/86400000); if(n<=0) return "aujourd'hui"; if(n===1) return "hier"; return "il y a "+n+" j"; }
function parseNum(x){ if(x==null) return null; const m=String(x).replace(",",".").match(/(\d+(?:\.\d+)?)/); return m?parseFloat(m[1]):null; }
function toKg(v,unit){ return unit==="lb" ? v*0.453592 : v; }
function fmtKg(v){ v=Math.round(v*10)/10; return Number.isInteger(v)?String(v):v.toFixed(1); }
function lbFromKg(kg){ return Math.round(kg*2.20462); }

function summarizeSets(entry){
  const unit=entry.unit||"kg";
  return (entry.sets||[]).filter(s=>(s.w||s.r)).map(s=>{
    const w=(s.w==null?"":String(s.w)).trim(), r=(s.r==null?"":String(s.r)).trim();
    if(unit==="pdc") return r||w;
    if(unit==="plaq"){ if(w&&r) return "niv "+w+" × "+r; if(w) return "niv "+w; return r; }
    if(w&&r) return w+" "+unit+" × "+r;
    if(w) return w+" "+unit;
    return r;
  }).join("   ");
}
/* score en kg (pour progrès/records) ; si pas de poids -> reps */
function entryScore(entry){
  const unit=entry.unit||"kg";
  if(unit==="plaq"){
    let best=null,bestReps=null,bestR=null;
    (entry.sets||[]).forEach(s=>{ const w=parseNum(s.w), r=parseNum(s.r); if(w!=null&&(best==null||w>best)){ best=w; bestReps=r; } if(r!=null&&(bestR==null||r>bestR)) bestR=r; });
    if(best!=null) return {val:best,type:"plaq",label:"niveau "+best+(bestReps!=null?(" × "+bestReps):"")};
    if(bestR!=null) return {val:bestR,type:"reps",label:bestR+" reps"};
    return null;
  }
  let bestKg=null,bestReps=null,bestR=null;
  (entry.sets||[]).forEach(s=>{
    const w=parseNum(s.w), r=parseNum(s.r);
    if(w!=null && unit!=="pdc"){ const kg=toKg(w,unit); if(bestKg==null||kg>bestKg){ bestKg=kg; bestReps=r; } }
    if(r!=null && (bestR==null||r>bestR)) bestR=r;
  });
  if(bestKg!=null) return {val:bestKg,type:"kg",label:fmtKg(bestKg)+" kg"+(bestReps!=null?(" × "+bestReps):"")};
  if(bestR!=null) return {val:bestR,type:"reps",label:bestR+" reps"};
  return null;
}
function bestScoreBefore(exId, beforeIdx){
  const h=DB[exId]||[]; let best=null;
  for(let i=0;i<beforeIdx && i<h.length;i++){ const sc=entryScore(h[i]); if(sc && (best==null||sc.val>best)) best=sc.val; }
  return best;
}
function bestScoreEver(exId){
  const h=DB[exId]||[]; let best=null;
  h.forEach(e=>{ const sc=entryScore(e); if(sc && (best==null||sc.val>best.val)) best=sc; });
  return best;
}
/* Affiche un score en kg, avec l'équivalent lb entre parenthèses si l'exo est en lb. */
function withLb(exId, sc){
  if(!sc) return "-";
  if(sc.type!=="kg") return sc.label;
  if(unitOf(exId)==="lb") return sc.label.replace(/^(\S+ kg)/, "$1 ("+lbFromKg(sc.val)+" lb)");
  return sc.label;
}
function todayEntryOf(exId, sess){
  const h=DB[exId]||[]; if(!h.length) return null;
  const e=h[h.length-1];
  return (e.date===todayStr() && e.session===sess) ? e : null;
}
function prevEntryOf(exId, sess){
  const h=DB[exId]||[]; if(!h.length) return null;
  const t=todayEntryOf(exId,sess);
  for(let i=h.length-1;i>=0;i--){ if(h[i]!==t) return h[i]; }
  return null;
}

/* ================= Rendu principal ================= */
let currentTab=0;
const tabsEl=document.getElementById("tabs");
const mainEl=document.getElementById("main");
let prAnnounced={};

function renderTabs(){
  tabsEl.innerHTML="";
  TABS.forEach((s,i)=>{

function exerciseCard(e, sess){
  const card=document.createElement("div"); card.className="card";
  const unit=unitOf(e.id);
  const todayE=todayEntryOf(e.id, sess);
  const prevE=prevEntryOf(e.id, sess);

  // en-tête + sélecteur d'unité
  const head=document.createElement("div"); head.className="ex-head";
  const lbApprox = (e.hintKg && unit==="lb") ? (" (≈ "+lbFromKg(e.hintKg)+" lb)") : "";
  head.innerHTML=`<div>
      ${e.ss?`<span class="ss-tag">${e.ss}</span><br>`:""}
      <div class="ex-name">${e.name}</div>
      <div class="ex-target">Objectif : ${e.sets} × ${e.reps} · conseillé : ${e.hint}${lbApprox} · repos ${e.rest}</div>
    </div>`;
  card.appendChild(head);
  {
    const uwrap=document.createElement("div"); uwrap.style.cssText="margin-top:8px";
    uwrap.innerHTML=`<div class="ex-target" style="margin-bottom:4px">Unité : kg · lb · PL (plaquette) · PDC (poids du corps)</div>`;
    const seg=document.createElement("div"); seg.style.cssText="display:flex;gap:6px";
    [["kg","kg"],["lb","lb"],["plaq","PL"],["pdc","PDC"]].forEach(([v,lab])=>{
      const b=document.createElement("button"); b.textContent=lab;
      b.style.cssText="flex:1;padding:10px 0;border-radius:9px;font-size:14px;font-weight:700;border:1px solid var(--line);"+(v===unit?"background:var(--green);color:#fff;border-color:var(--green)":"background:#fff;color:var(--ink)");
      b.onclick=()=>{ UNITS[e.id]=v; saveUnits(); const te=todayEntryOf(e.id,sess); if(te){ te.unit=v; saveDB(); } renderSession(); };
      seg.appendChild(b);
    });
    uwrap.appendChild(seg); card.appendChild(uwrap);
  }

  if(e.cue){ const c=document.createElement("div"); c.className="cue"; c.textContent="Rappel : "+e.cue; card.appendChild(c); }

  // dernière fois + record
  const lastEl=document.createElement("div"); lastEl.className="last";
  lastEl.innerHTML = prevE ? `<b>Dernière fois</b> (${daysAgo(prevE.date)}) : ${summarizeSets(prevE)||"-"}`
                           : "<b>Dernière fois</b> : jamais fait. Note ce que tu fais aujourd'hui.";
  card.appendChild(lastEl);
  const rec=bestScoreEver(e.id);
  if(rec){ const r=document.createElement("div"); r.className="last"; r.style.background="#eef6ef"; r.style.color="var(--green)"; r.innerHTML=`<b>Record</b> : ${withLb(e.id, rec)}`; card.appendChild(r); }

  // lignes de séries
  const setsWrap=document.createElement("div"); setsWrap.className="sets"; card.appendChild(setsWrap);
  const doneSets = todayE ? todayE.sets.slice() : [];
  const nSuggest = Math.max(0, e.sets - doneSets.length);

  function suggestVal(i){
    if(prevE && prevE.sets[i]) return {w:prevE.sets[i].w, r:prevE.sets[i].r};
    if(unit==="pdc"||unit==="plaq") return {w:"", r:e.reps};
    if(e.hintKg){ const w = unit==="lb" ? lbFromKg(e.hintKg) : e.hintKg; return {w:String(w), r:e.reps}; }
    return {w:"", r:e.reps};
  }
  function saveFromUI(){
    const rows=[...setsWrap.querySelectorAll(".setrow")];
    const sets=rows.filter(r=>r.classList.contains("done")).map(r=>{ const wEl=r.querySelector(".w"); return { w:wEl?wEl.value.trim():"", r:r.querySelector(".r").value.trim() }; }).filter(s=>s.w||s.r);
    DB[e.id]=DB[e.id]||[];
    const h=DB[e.id];
    const isTodays = h.length && h[h.length-1].date===todayStr() && h[h.length-1].session===sess;
    if(sets.length){
      if(isTodays){ h[h.length-1].sets=sets; h[h.length-1].unit=unit; }
      else h.push({date:todayStr(), session:sess, unit, sets});
    } else if(isTodays){ h.pop(); if(!h.length) delete DB[e.id]; }
    saveDB();
  }
  function makeRow(val, done){
    const row=document.createElement("div"); row.className="setrow"+(done?" done":"");
    const i=setsWrap.children.length;
    let wField="";
    if(unit!=="pdc"){ const wl=unit==="plaq"?"Niveau (n°)":"Poids ("+unit+")"; const wp=unit==="plaq"?"n°":unit;
      wField=`<div class="field"><label>${wl}</label><input type="text" inputmode="decimal" class="w" placeholder="${wp}" value="${val&&val.w!=null?val.w:""}"></div>`; }
    row.innerHTML=`<div class="n">${i+1}</div>
      ${wField}
      <div class="field"><label>Reps</label><input type="text" inputmode="text" class="r" placeholder="${e.reps}" value="${val&&val.r!=null?val.r:""}"></div>
      <button class="tick${done?" on":""}" title="Valider la série">✓</button>`;
    const tick=row.querySelector(".tick");
    tick.onclick=()=>{
      const nowDone=!row.classList.contains("done");
      row.classList.toggle("done", nowDone); tick.classList.toggle("on", nowDone);
      saveFromUI();
      if(nowDone){
        const te=todayEntryOf(e.id,sess);
        if(te){ const sc=entryScore(te); const prevBest=bestScoreBefore(e.id, (DB[e.id]||[]).length-1);
          if(sc && (prevBest==null || sc.val>prevBest) && (DB[e.id]||[]).length>1 && !prAnnounced[e.id]){ prAnnounced[e.id]=true; toast("Nouveau record : "+withLb(e.id, sc)+" !"); }
          else toast("Série validée"); }
      } else toast("Série retirée");
      renderSession();
    };
    const wEl2=row.querySelector(".w"); if(wEl2) wEl2.oninput=()=>{ if(row.classList.contains("done")) saveFromUI(); };
    row.querySelector(".r").oninput=()=>{ if(row.classList.contains("done")) saveFromUI(); };
    setsWrap.appendChild(row);
  }
  doneSets.forEach(s=> makeRow(s, true));
  for(let i=0;i<nSuggest;i++) makeRow(suggestVal(doneSets.length+i), false);

  const actions=document.createElement("div"); actions.className="card-actions";
  const add=document.createElement("button"); add.className="addset"; add.textContent="+ série";
  add.onclick=()=> makeRow(unit==="pdc"?{w:"",r:e.reps}:suggestVal(setsWrap.children.length), false);
  actions.appendChild(add); card.appendChild(actions);
  return card;
}

function goTab(key){ const i=TABS.findIndex(t=>t.key===key); if(i>=0){ currentTab=i; renderTabs(); renderSession(); window.scrollTo(0,0); } }
function lastSessionDate(key){ let d=null; Object.keys(DB).forEach(exId=>DB[exId].forEach(en=>{ if(en.session===key && (d==null||en.date>d)) d=en.date; })); return d; }
function nextSession(){ let best=PROGRAM[0].key, bestDate="9999-99-99"; PROGRAM.forEach(s=>{ const d=lastSessionDate(s.key)||"0000-00-00"; if(d<bestDate){ bestDate=d; best=s.key; } }); return best; }
function latestRecord(){ let out=null,outDate="0000-00-00";
  Object.keys(DB).forEach(exId=>{ const sc=bestScoreEver(exId); if(!sc) return; let d=null; DB[exId].forEach(en=>{ const s=entryScore(en); if(s && s.val===sc.val && (d==null||en.date>d)) d=en.date; }); if(d && d>outDate){ outDate=d; out={exId, sc}; } });
  return out;
}
function importData(text){
  let obj; try{ obj=JSON.parse(text); }catch(e){ toast("Code invalide"); return; }
  let n=0;
  if(Array.isArray(obj.clear)){ obj.clear.forEach(exId=>{ if(DB[exId]){ delete DB[exId]; n++; } }); saveDB(); }
  if(Array.isArray(obj.meas)){ obj.meas.forEach(m=>{ if(!m.date||!m.v) return; MEAS=MEAS.filter(x=>x.date!==m.date); MEAS.push({date:m.date, v:m.v}); n++; }); MEAS.sort((a,b)=>a.date<b.date?-1:1); saveMeas(); }
  if(Array.isArray(obj.pm)){ obj.pm.forEach(p=>{ if(!p.mois||p.poids==null) return; const ex=PM.find(x=>x.mois===p.mois); if(ex) ex.poids=p.poids; else PM.push({mois:p.mois, poids:p.poids, estime:p.estime}); n++; }); savePM(); }
  if(obj.db && typeof obj.db==="object"){ Object.keys(obj.db).forEach(exId=>{ const arr=obj.db[exId]; if(!Array.isArray(arr)) return; DB[exId]=DB[exId]||[];
    arr.forEach(en=>{ if(!en.date) return; DB[exId]=DB[exId].filter(x=>!(x.date===en.date && x.session===en.session)); DB[exId].push({date:en.date, session:en.session, unit:en.unit||defUnit(exId), sets:en.sets||[]}); n++; });
    DB[exId].sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0)); if(!DB[exId].length) delete DB[exId]; }); saveDB(); }
  toast(n+" élément(s) importé(s)"); currentTab=0; renderTabs(); renderSession();
}

/* ================= Journal ================= */
function collectSessions(){
  const map={};
  Object.keys(DB).forEach(exId=>{
    (DB[exId]||[]).forEach((entry,idx)=>{
      const sess=entry.session||"AUTRE"; const k=entry.date+"|"+sess;
      if(!map[k]) map[k]={date:entry.date, session:sess, items:[]};
      map[k].items.push({exId, idx});
    });
  });
  const arr=Object.values(map);
  arr.sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:(a.session<b.session?-1:1)));
  return arr;
}
function sessionLabel(key){ const t=PROGRAM.find(s=>s.key===key); return t?t.label:"Séance"; }
function sessionLabelShort(key){ const t=PROGRAM.find(s=>s.key===key); if(!t) return "?"; return t.label.replace("Haut","H").replace("Bas","B").replace(/\s/g,""); }

  document.getElementById("subtitle").textContent="Journal - toutes tes séances";

  const tg=document.createElement("div"); tg.style.cssText="display:flex;gap:8px;margin-bottom:12px";

  if(journalView==="cal"){ renderCalendar(groups); return; }

/* ================= Graphe ================= */
function lineChart(points, opts){
  opts=opts||{};
  const W=320,H=150,padL=34,padR=12,padT=12,padB=24;
  if(!points.length) return "<div class='last'>Pas encore de donnée à afficher.</div>";
  const ys=points.map(p=>p.y);
  let ymin=Math.min(...ys), ymax=Math.max(...ys);
  if(opts.yMin!=null) ymin=Math.min(ymin,opts.yMin);
  if(opts.yMax!=null) ymax=Math.max(ymax,opts.yMax);
  if(opts.lines) opts.lines.forEach(l=>{ ymin=Math.min(ymin,l.y); ymax=Math.max(ymax,l.y); });
  if(ymin===ymax){ ymin-=1; ymax+=1; }
  const pd=(ymax-ymin)*0.15; ymin-=pd; ymax+=pd;
  const nx=Math.max(1,points.length-1);
  const X=i=> padL+(i/nx)*(W-padL-padR);
  const Y=v=> padT+(1-(v-ymin)/(ymax-ymin))*(H-padT-padB);
  let g="";
  if(opts.lines) opts.lines.forEach(l=>{ const y=Y(l.y).toFixed(1); g+=`<line x1='${padL}' y1='${y}' x2='${W-padR}' y2='${y}' stroke='${l.color||"#43594B"}' stroke-width='1' stroke-dasharray='4 3'></line><text x='${W-padR}' y='${(+y-3)}' font-size='9' fill='${l.color||"#43594B"}' text-anchor='end'>${l.label||""}</text>`; });
  g+=`<text x='4' y='${(Y(ymax)+4).toFixed(1)}' font-size='10' fill='#9a9f97'>${(+ymax.toFixed(1))}</text>`;
  g+=`<text x='4' y='${(Y(ymin)+4).toFixed(1)}' font-size='10' fill='#9a9f97'>${(+ymin.toFixed(1))}</text>`;
  const d=points.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  g+=`<path d='${d}' fill='none' stroke='#43594B' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'></path>`;
  points.forEach((p,i)=>{ g+=`<circle cx='${X(i).toFixed(1)}' cy='${Y(p.y).toFixed(1)}' r='3.2' fill='#43594B'></circle>`; });
  [0,points.length-1].filter((v,i,a)=>a.indexOf(v)===i).forEach(i=>{ g+=`<text x='${X(i).toFixed(1)}' y='${H-6}' font-size='10' fill='#9a9f97' text-anchor='${i===0?"start":"end"}'>${points[i].x}</text>`; });
  return `<svg viewBox='0 0 ${W} ${H}' style='width:100%;height:auto;display:block'>${g}</svg>`;
}

let bilanWeek=null;
function prsInWeek(mon){
  const end=addDaysIso(mon,6); const out=[];
  Object.keys(DB).forEach(exId=>{ const h=DB[exId]; if(h.length<2) return;
    let bestBefore=null, bestWk=null, bestWkSc=null;
    h.forEach(en=>{ const s=entryScore(en); if(!s) return; if(en.date<mon){ if(bestBefore==null||s.val>bestBefore) bestBefore=s.val; } else if(en.date<=end){ if(bestWk==null||s.val>bestWk){ bestWk=s.val; bestWkSc=s; } } });
    if(bestWk!=null && bestBefore!=null && bestWk>bestBefore) out.push({exId, sc:bestWkSc});
  });
  return out;
}
function stagnantExercises(){
  const out=[];
  Object.keys(DB).forEach(exId=>{ const h=DB[exId]; if(h.length<4) return;
    const last=entryScore(h[h.length-1]); const ref=entryScore(h[h.length-4]);
    if(last && ref && last.type===ref.type && last.val<=ref.val) out.push(exId);
  });
  return out;
}

    h.slice(-4).forEach(en=>{ out+="   "+frDate(en.date)+" : "+(summarizeSets(en)||"-")+"\n"; });
    out+="\n";
  });
  if(!any) out+="(aucune séance enregistrée pour le moment)\n\n";
  // séries par muscle cette semaine
  const wk=weekSets(weekMonday(todayStr())); const tw=MUSCLE_ORDER.reduce((a,m)=>a+(wk[m]||0),0);
  if(tw){ out+="SÉRIES PAR MUSCLE (cette semaine)\n"; MUSCLE_ORDER.forEach(m=>{ if(wk[m]) out+="   "+m+" : "+wk[m]+"\n"; }); out+="\n"; }
  const nk=Object.keys(NOTES).filter(k=>NOTES[k]).sort().reverse();
  if(nk.length){ out+="RESSENTIS\n"; nk.slice(0,12).forEach(k=>{ const [d,s]=k.split("|"); out+="   "+frDate(d)+" ("+sessionLabel(s)+") : "+NOTES[k]+"\n"; }); out+="\n"; }
  // poids : bilan mensuel
  { const rows=pmRows(); const actuel=rows.length?rows[rows.length-1].poids:BW_START;
    out+="POIDS (objectif "+BW_GOAL+" kg)\n   Départ "+BW_START+" · actuel "+actuel+" · perdu "+(+(BW_START-actuel).toFixed(1))+" kg · reste "+(+(actuel-BW_GOAL).toFixed(1))+" kg\n";
    rows.slice(-6).forEach(r=>{ out+="   "+r.mois+" : "+r.poids+" kg\n"; }); out+="\n"; }
  if(MEAS.length){ const m=MEAS[MEAS.length-1]; out+="MENSURATIONS ("+frDate(m.date)+", cm)\n"; MEAS_FIELDS.forEach(f=>{ if(m.v[f.k]!=null) out+="   "+f.label+" : "+m.v[f.k]+"\n"; }); out+="\n"; }
  return out.trim();
}
const modal=document.getElementById("modal");
document.getElementById("btn-export").onclick=()=>{ document.getElementById("export-text").value=buildExport(); modal.classList.add("open"); };
document.getElementById("btn-close").onclick=()=>modal.classList.remove("open");
modal.onclick=(ev)=>{ if(ev.target===modal) modal.classList.remove("open"); };
document.getElementById("btn-share").onclick=async()=>{
  const text=document.getElementById("export-text").value;
  if(navigator.share){ try{ await navigator.share({title:"Carnet muscu Fanny", text}); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(text); toast("Copié ! Colle-le dans un message"); }
  catch(e){ const ta=document.getElementById("export-text"); ta.removeAttribute("readonly"); ta.focus(); ta.select(); toast("Sélectionne puis copie"); }
};

/* ================= Effacer aujourd'hui ================= */
document.getElementById("btn-reset").onclick=()=>{
  if(!confirm("Effacer les séries enregistrées AUJOURD'HUI (toutes séances) ? L'historique des jours précédents est gardé.")) return;
  const t=todayStr(); let n=0;
  Object.keys(DB).forEach(id=>{ const h=DB[id]; if(h.length && h[h.length-1].date===t){ h.pop(); n++; if(!h.length) delete DB[id]; } });
  saveDB(); prAnnounced={}; toast(n+" exercice(s) remis à zéro"); renderSession();
};

/* ================= Toast ================= */
let toastT=null;
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1700); }

/* ================= Init + service worker ================= */
renderTabs(); renderSession();
// Le titre ramène à l'accueil
const h1=document.querySelector("header h1"); if(h1){ h1.style.cursor="pointer"; h1.onclick=()=>goTab("HOME"); }
// Rouvrir l'appli (revenir dessus) ramène à l'accueil
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible"){ currentTab=0; renderTabs(); renderSession(); window.scrollTo(0,0); } });
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
</script>
