<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#43594B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Muscu Fanny">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Carnet Muscu Fanny</title>
<style>
  :root{
    --green:#43594B; --green-soft:#5c7565; --bg:#F2F1F0; --card:#ffffff;
    --line:#e2e0dd; --ink:#20241f; --muted:#7c827a; --accent:#43594B;
    --ok:#3a7d44; --ok-bg:#e7f2e8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    background:var(--green); color:#fff; padding:14px 16px calc(14px);
    padding-top:calc(14px + env(safe-area-inset-top));
    position:sticky; top:0; z-index:30;
  }
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
  header .sub{font-size:12px;opacity:.8;margin-top:2px}
  .top-actions{display:flex;gap:8px;margin-top:10px}
  .top-actions button{
    flex:1;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);
    border-radius:10px;padding:9px;font-size:13px;font-weight:600;
  }
  .top-actions button:active{background:rgba(255,255,255,.28)}
  .tabs{
    display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--bg);
    position:sticky;top:0;z-index:20;-webkit-overflow-scrolling:touch;
    border-bottom:1px solid var(--line);
  }
  .tab{
    white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600;flex:0 0 auto;
  }
  .tab.active{background:var(--green);color:#fff;border-color:var(--green)}
  .tab-journal{border-style:dashed}
  .tab-journal.active{border-style:solid}
  main{padding:12px 12px 40px}
  .warm{
    background:#fff7e8;border:1px solid #f0dcae;border-radius:12px;padding:10px 12px;
    font-size:13px;color:#7a5a1e;margin-bottom:12px;
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px;margin-bottom:12px;
  }
  .card.done{border-color:#bcd9c1;background:#fbfefb}
  .ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .ex-name{font-size:16px;font-weight:700;line-height:1.2}
  .ex-target{font-size:12px;color:var(--muted);margin-top:3px}
  .ss-tag{
    display:inline-block;background:#eef2ef;color:var(--green);border-radius:6px;
    font-size:11px;font-weight:700;padding:2px 7px;margin-bottom:6px;
  }
  .cue{font-size:12px;color:var(--green-soft);background:#f3f6f3;border-radius:8px;padding:7px 9px;margin:8px 0}
  .last{
    font-size:12.5px;color:var(--muted);margin:8px 0 6px;
    background:#f6f5f3;border-radius:8px;padding:7px 9px;
  }
  .last b{color:var(--ink)}
  .sets{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .setrow{display:flex;align-items:center;gap:8px}
  .setrow .n{width:20px;font-size:12px;color:var(--muted);font-weight:700;text-align:center;flex:0 0 auto}
  .field{flex:1;display:flex;flex-direction:column}
  .field label{font-size:10px;color:var(--muted);margin:0 0 2px 2px;text-transform:uppercase;letter-spacing:.4px}
  input[type=text]{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 10px;font-size:16px;
    background:#fff;color:var(--ink);
  }
  input[type=text]:focus{outline:none;border-color:var(--green)}
  .rm{background:none;border:none;color:#c25;font-size:20px;padding:0 4px;flex:0 0 auto}
  .card-actions{display:flex;gap:8px;margin-top:10px;align-items:center}
  .addset{background:#eef2ef;color:var(--green);border:none;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
  .save{flex:1;background:var(--green);color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:700}
  .save.done{background:var(--ok-bg);color:var(--ok)}
  .save:active{opacity:.85}
  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50;
    align-items:center;justify-content:center;padding:16px;
  }
  .modal-bg.open{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
  .modal h2{margin:0;padding:14px 16px;font-size:16px;border-bottom:1px solid var(--line)}
  .modal textarea{flex:1;border:none;padding:14px 16px;font-size:13px;font-family:ui-monospace,Menlo,monospace;resize:none;min-height:220px}
  .modal .mact{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
  .modal .mact button{flex:1;border-radius:10px;padding:11px;font-size:14px;font-weight:700;border:none}
  .btn-primary{background:var(--green);color:#fff}
  .btn-ghost{background:#eef0ee;color:var(--ink)}
  .hint{font-size:11px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.5}
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--green);color:#fff;
    padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;
    pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.2)
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Carnet Muscu Fanny</h1>
  <div class="sub" id="subtitle">Programme Pareto, 4 seances / semaine</div>
  <div class="top-actions">
    <button id="btn-export">Exporter pour le coach</button>
    <button id="btn-reset">Effacer aujourd'hui</button>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>
<main id="main"></main>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h2>Recap pour le coach</h2>
    <textarea id="export-text" readonly></textarea>
    <div class="mact">
      <button class="btn-ghost" id="btn-close">Fermer</button>
      <button class="btn-primary" id="btn-share">Partager / Copier</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- Donnees du programme (issu du fichier du coach) ---------- */
const CUE_BSS = "Buste penche ~45, appui loin devant, charge sentie sur le talon arriere.";
const SS = "Superset (enchaine)";

const PROGRAM = [
  { key:"HAUT_A", label:"Haut A", focus:"Epaules / posture", warm:"Echauffement avant de commencer.",
    ex:[
      {id:"tirage_dos_assis", name:"Tirage dos assis (poulie)", sets:4, reps:"8", hint:"25 kg", rest:"60s"},
      {id:"dev_epaules_arnold", name:"Developpe epaules Arnold", sets:3, reps:"8", hint:"6 kg", rest:"60s"},
      {id:"pompes_inclinees", name:"Pompes (inclinees)", sets:3, reps:"6", hint:"PDC", rest:"60s"},
      {id:"face_pull", name:"Face pull ou oiseau (poulie)", sets:3, reps:"10", hint:"4 kg", rest:"60s"},
      {id:"triceps_corde", name:"Triceps a la corde (poulie)", sets:2, reps:"14", hint:"4 kg", rest:"45s"},
    ]},
  { key:"BAS_A", label:"Bas A", focus:"Fessiers, volume bilateral", warm:"Echauffement avant de commencer.",
    ex:[
      {id:"hip_thrust_barre", name:"Hip thrust barre / haltere", sets:4, reps:"8", hint:"5 kg", rest:"60s"},
      {id:"bulgarian_split_squat", name:"Bulgarian split squat", sets:3, reps:"7 / jambe", hint:"4 kg", rest:"60s", ss:SS, cue:CUE_BSS},
      {id:"bstance_rdl", name:"B-Stance RDL", sets:3, reps:"7", hint:"2 x 5 kg", rest:"60s", ss:SS},
      {id:"abduction_hanche", name:"Abduction de hanche a la poulie", sets:1, reps:"10", hint:"2 kg", rest:"60s"},
      {id:"gainage_mains", name:"Gainage sur les mains", sets:3, reps:"30s", hint:"PDC", rest:"15s"},
    ]},
  { key:"HAUT_B", label:"Haut B", focus:"Tirer / posture", warm:"Echauffement avant de commencer.",
    ex:[
      {id:"tirage_vertical", name:"Tirage vertical", sets:3, reps:"10", hint:"20 kg", rest:"90s"},
      {id:"low_row_uni", name:"Low row unilateral", sets:3, reps:"10-12 / cote", hint:"6 kg", rest:"75s"},
      {id:"dev_couche", name:"Developpe couche", sets:3, reps:"15", hint:"6 kg", rest:"90s"},
      {id:"elevations_laterales", name:"Elevations laterales", sets:3, reps:"14", hint:"4 kg", rest:"60s"},
      {id:"triceps_corde", name:"Triceps a la corde", sets:3, reps:"14", hint:"4 kg", rest:"45s"},
      {id:"prone_ytw", name:"Prone Y-T-W / prone cobra", sets:3, reps:"12", hint:"PDC", rest:"45s"},
    ]},
  { key:"BAS_B", label:"Bas B", focus:"Fessiers, unilateral", warm:"Echauffement avant de commencer.",
    ex:[
      {id:"hip_thrust_uni", name:"Hip thrust barre - Unilateral", sets:4, reps:"8 / jambe", hint:"PDC", rest:"60s"},
      {id:"bulgarian_split_squat", name:"Bulgarian split squat", sets:3, reps:"7 / jambe", hint:"4 kg", rest:"60s", ss:SS, cue:CUE_BSS},
      {id:"bstance_rdl", name:"B-Stance RDL", sets:3, reps:"7", hint:"2 x 5 kg", rest:"60s", ss:SS},
      {id:"abduction_hanche", name:"Abduction de hanche a la poulie", sets:1, reps:"10", hint:"2 kg", rest:"60s"},
      {id:"gainage_mains", name:"Gainage sur les mains", sets:3, reps:"30s", hint:"PDC", rest:"15s"},
    ]},
];

/* exercice id -> nom lisible (pour l'export) */
const EX_NAME = {};
PROGRAM.forEach(s=>s.ex.forEach(e=>{ EX_NAME[e.id]=e.name; }));

/* onglets = les 4 seances + le Journal */
const TABS = PROGRAM.concat([{key:"JOURNAL", label:"Journal", journal:true}]);

/* ---------- Stockage ---------- */
const STORE_KEY = "muscu_fanny_v1";
function loadDB(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveDB(db){ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
let DB = loadDB();   // { exerciseId: [ {date:"2026-08-05", sets:[{w,r},...]}, ... ] }

function lastEntry(exId){
  const h = DB[exId]; if(!h || !h.length) return null;
  return h[h.length-1];
}
function todayStr(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function frDate(iso){
  const [y,m,d]=iso.split("-");
  const mois=["janv","fevr","mars","avr","mai","juin","juil","aout","sept","oct","nov","dec"];
  return d+" "+mois[parseInt(m,10)-1]+" "+y;
}
function daysAgo(iso){
  const a=new Date(iso+"T00:00:00"), b=new Date(todayStr()+"T00:00:00");
  const n=Math.round((b-a)/86400000);
  if(n<=0) return "aujourd'hui"; if(n===1) return "hier"; return "il y a "+n+" j";
}
function summarizeSets(sets){
  return sets.filter(s=>(s.w||s.r)).map(s=>{
    const w=(s.w||"").trim(), r=(s.r||"").trim();
    if(w&&r) return w+" x "+r;
    return w||r;
  }).join("  -  ");
}

/* ---------- Rendu ---------- */
let currentTab = 0;
const tabsEl=document.getElementById("tabs");
const mainEl=document.getElementById("main");

function renderTabs(){
  tabsEl.innerHTML="";
  TABS.forEach((s,i)=>{
    const b=document.createElement("button");
    b.className="tab"+(i===currentTab?" active":"")+(s.journal?" tab-journal":"");
    b.textContent=s.label;
    b.onclick=()=>{ currentTab=i; renderTabs(); renderSession(); window.scrollTo(0,0); };
    tabsEl.appendChild(b);
  });
}

function renderSession(){
  const t=TABS[currentTab];
  if(t.journal){ renderJournal(); return; }
  const s=t;
  document.getElementById("subtitle").textContent = s.label+" - "+s.focus;
  mainEl.innerHTML="";
  const warm=document.createElement("div");
  warm.className="warm";
  warm.textContent="Echauffement d'abord, puis les exercices dans l'ordre.";
  mainEl.appendChild(warm);

  s.ex.forEach((e,idx)=>{
    mainEl.appendChild(exerciseCard(e));
  });

  const hint=document.createElement("div");
  hint.className="hint";
  hint.innerHTML="Tes poids sont enregistres sur ce telephone.<br>Astuce : garde le telephone en mode avion, ca marche pareil.";
  mainEl.appendChild(hint);
}

function exerciseCard(e){
  const card=document.createElement("div");
  card.className="card";
  const last=lastEntry(e.id);

  // saved today ?
  const savedToday = last && last.date===todayStr();
  if(savedToday) card.classList.add("done");

  const head=document.createElement("div");
  head.className="ex-head";
  head.innerHTML=`<div>
      ${e.ss?`<span class="ss-tag">${e.ss}</span><br>`:""}
      <div class="ex-name">${e.name}</div>
      <div class="ex-target">Objectif : ${e.sets} x ${e.reps} &middot; charge conseillee : ${e.hint} &middot; repos ${e.rest}</div>
    </div>`;
  card.appendChild(head);

  if(e.cue){
    const cue=document.createElement("div"); cue.className="cue"; cue.textContent="Rappel : "+e.cue; card.appendChild(cue);
  }

  // last time
  const lastEl=document.createElement("div"); lastEl.className="last";
  if(last){
    lastEl.innerHTML=`<b>Derniere fois</b> (${daysAgo(last.date)}) : ${summarizeSets(last.sets)||"-"}`;
  }else{
    lastEl.innerHTML="<b>Derniere fois</b> : jamais fait encore. Note le poids d'aujourd'hui.";
  }
  card.appendChild(lastEl);

  // set rows
  const setsWrap=document.createElement("div"); setsWrap.className="sets";
  card.appendChild(setsWrap);

  // prefill values: derniere fois si dispo (charge progressive),
  // sinon les charges conseillees du coach (1ere fois)
  let prefill=[];
  if(last) prefill = last.sets.map(x=>({w:x.w,r:x.r}));
  else prefill = Array.from({length:e.sets}, ()=>({w:e.hint, r:e.reps}));
  const nRows = Math.max(e.sets, prefill.length, 1);

  function addRow(val){
    const i=setsWrap.children.length;
    const row=document.createElement("div"); row.className="setrow";
    row.innerHTML=`<div class="n">${i+1}</div>
      <div class="field"><label>Poids</label><input type="text" inputmode="text" class="w" placeholder="${e.hint}" value="${val&&val.w!=null?val.w:""}"></div>
      <div class="field"><label>Reps</label><input type="text" inputmode="text" class="r" placeholder="${e.reps}" value="${val&&val.r!=null?val.r:""}"></div>
      <button class="rm" title="Retirer">&times;</button>`;
    row.querySelector(".rm").onclick=()=>{ row.remove(); renumber(); };
    setsWrap.appendChild(row);
  }
  function renumber(){ [...setsWrap.children].forEach((r,i)=>r.querySelector(".n").textContent=i+1); }

  for(let i=0;i<nRows;i++){ addRow(prefill[i]); }

  const actions=document.createElement("div"); actions.className="card-actions";
  const addBtn=document.createElement("button"); addBtn.className="addset"; addBtn.textContent="+ serie";
  addBtn.onclick=()=>addRow(null);
  const saveBtn=document.createElement("button"); saveBtn.className="save"+(savedToday?" done":"");
  saveBtn.textContent=savedToday?"Enregistre aujourd'hui - modifier":"Enregistrer";
  saveBtn.onclick=()=>{
    const sets=[...setsWrap.querySelectorAll(".setrow")].map(r=>({
      w:r.querySelector(".w").value.trim(),
      r:r.querySelector(".r").value.trim()
    })).filter(s=>s.w||s.r);
    if(!sets.length){ toast("Rien a enregistrer"); return; }
    const sess = TABS[currentTab].key;
    DB[e.id]=DB[e.id]||[];
    const h=DB[e.id];
    if(h.length && h[h.length-1].date===todayStr() && h[h.length-1].session===sess){ h[h.length-1].sets=sets; }
    else { h.push({date:todayStr(), sets, session:sess}); }
    saveDB(DB);
    toast("Enregistre");
    renderSession();
  };
  actions.appendChild(addBtn); actions.appendChild(saveBtn);
  card.appendChild(actions);

  return card;
}

/* ---------- Journal : liste des seances datees, reouvrables ---------- */
function collectSessions(){
  const map={};
  Object.keys(DB).forEach(exId=>{
    DB[exId].forEach((entry,idx)=>{
      const sess=entry.session||"AUTRE";
      const k=entry.date+"|"+sess;
      if(!map[k]) map[k]={date:entry.date, session:sess, items:[]};
      map[k].items.push({exId, idx});
    });
  });
  const arr=Object.values(map);
  arr.sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:(a.session<b.session?-1:1)));
  return arr;
}
function sessionLabel(key){ const t=PROGRAM.find(s=>s.key===key); return t?t.label:"Seance"; }

let journalOpen={};
function renderJournal(){
  document.getElementById("subtitle").textContent="Journal - toutes tes seances";
  mainEl.innerHTML="";
  const groups=collectSessions();
  if(!groups.length){
    const d=document.createElement("div"); d.className="warm";
    d.textContent="Aucune seance enregistree pour le moment. Fais ta premiere seance, elle apparaitra ici avec sa date.";
    mainEl.appendChild(d); return;
  }
  groups.forEach(g=>{
    const key=g.date+"|"+g.session;
    const open=!!journalOpen[key];
    const card=document.createElement("div"); card.className="card";
    const head=document.createElement("div"); head.className="ex-head"; head.style.cursor="pointer";
    head.innerHTML=`<div>
        <div class="ex-name">${sessionLabel(g.session)}</div>
        <div class="ex-target">${frDate(g.date)} &middot; ${daysAgo(g.date)} &middot; ${g.items.length} exercice(s)</div>
      </div><div style="font-size:22px;color:var(--muted);line-height:1">${open?"&minus;":"+"}</div>`;
    head.onclick=()=>{ journalOpen[key]=!open; renderJournal(); };
    card.appendChild(head);
    if(open){
      g.items.forEach(it=> card.appendChild(journalEditBlock(it.exId, it.idx)) );
      const del=document.createElement("button");
      del.className="addset"; del.style.color="#c25"; del.style.marginTop="12px"; del.style.width="100%";
      del.textContent="Supprimer cette seance";
      del.onclick=()=>{
        if(!confirm("Supprimer toute la seance du "+frDate(g.date)+" ("+sessionLabel(g.session)+") ?")) return;
        const byEx={};
        g.items.forEach(it=>{ (byEx[it.exId]=byEx[it.exId]||[]).push(it.idx); });
        Object.keys(byEx).forEach(exId=>{
          byEx[exId].sort((a,b)=>b-a).forEach(i=>DB[exId].splice(i,1));
          if(!DB[exId].length) delete DB[exId];
        });
        saveDB(DB); delete journalOpen[key]; toast("Seance supprimee"); renderJournal();
      };
      card.appendChild(del);
    }
    mainEl.appendChild(card);
  });
}

function journalEditBlock(exId, idx){
  const wrap=document.createElement("div");
  wrap.style.borderTop="1px solid var(--line)"; wrap.style.paddingTop="10px"; wrap.style.marginTop="10px";
  const entry=DB[exId][idx];
  const title=document.createElement("div"); title.className="ex-name"; title.style.fontSize="14px";
  title.textContent=EX_NAME[exId]||exId; wrap.appendChild(title);
  const setsWrap=document.createElement("div"); setsWrap.className="sets"; wrap.appendChild(setsWrap);
  function renum(){ [...setsWrap.children].forEach((r,i)=>r.querySelector(".n").textContent=i+1); }
  function addRow(val){
    const i=setsWrap.children.length;
    const row=document.createElement("div"); row.className="setrow";
    row.innerHTML=`<div class="n">${i+1}</div>
      <div class="field"><label>Poids</label><input type="text" class="w" value="${val&&val.w!=null?val.w:""}"></div>
      <div class="field"><label>Reps</label><input type="text" class="r" value="${val&&val.r!=null?val.r:""}"></div>
      <button class="rm">&times;</button>`;
    row.querySelector(".rm").onclick=()=>{ row.remove(); renum(); };
    setsWrap.appendChild(row);
  }
  (entry.sets||[]).forEach(s=>addRow(s));
  const acts=document.createElement("div"); acts.className="card-actions";
  const addBtn=document.createElement("button"); addBtn.className="addset"; addBtn.textContent="+ serie"; addBtn.onclick=()=>addRow(null);
  const save=document.createElement("button"); save.className="save"; save.textContent="Enregistrer les modifs";
  save.onclick=()=>{
    const sets=[...setsWrap.querySelectorAll(".setrow")].map(r=>({w:r.querySelector(".w").value.trim(), r:r.querySelector(".r").value.trim()})).filter(s=>s.w||s.r);
    DB[exId][idx].sets=sets; saveDB(DB); toast("Modifie");
  };
  acts.appendChild(addBtn); acts.appendChild(save); wrap.appendChild(acts);
  return wrap;
}

/* ---------- Export coach ---------- */
function buildExport(){
  let out="CARNET MUSCU FANNY\nExport du "+frDate(todayStr())+"\n\n";
  // group by exercise, show last 4 sessions
  const ids=Object.keys(DB);
  if(!ids.length) return out+"(aucune seance enregistree pour le moment)";
  // keep program order
  const ordered=[];
  PROGRAM.forEach(s=>s.ex.forEach(e=>{ if(DB[e.id] && !ordered.includes(e.id)) ordered.push(e.id); }));
  ids.forEach(id=>{ if(!ordered.includes(id)) ordered.push(id); });
  ordered.forEach(id=>{
    const h=DB[id]; if(!h||!h.length) return;
    out+="* "+(EX_NAME[id]||id)+"\n";
    h.slice(-4).forEach(entry=>{
      out+="   "+frDate(entry.date)+" : "+(summarizeSets(entry.sets)||"-")+"\n";
    });
    out+="\n";
  });
  return out.trim();
}
const modal=document.getElementById("modal");
document.getElementById("btn-export").onclick=()=>{
  document.getElementById("export-text").value=buildExport();
  modal.classList.add("open");
};
document.getElementById("btn-close").onclick=()=>modal.classList.remove("open");
modal.onclick=(ev)=>{ if(ev.target===modal) modal.classList.remove("open"); };
document.getElementById("btn-share").onclick=async ()=>{
  const text=document.getElementById("export-text").value;
  if(navigator.share){
    try{ await navigator.share({title:"Carnet muscu Fanny", text}); return; }catch(e){}
  }
  try{
    await navigator.clipboard.writeText(text);
    toast("Copie ! Colle-le dans un message");
  }catch(e){
    const ta=document.getElementById("export-text"); ta.removeAttribute("readonly"); ta.focus(); ta.select();
    toast("Selectionne puis copie");
  }
};

/* ---------- Effacer aujourd'hui ---------- */
document.getElementById("btn-reset").onclick=()=>{
  if(!confirm("Effacer les series enregistrees AUJOURD'HUI (toutes seances) ? L'historique des jours precedents est garde.")) return;
  const t=todayStr(); let n=0;
  Object.keys(DB).forEach(id=>{
    const h=DB[id];
    if(h.length && h[h.length-1].date===t){ h.pop(); n++; if(!h.length) delete DB[id]; }
  });
  saveDB(DB); toast(n+" exercice(s) remis a zero"); renderSession();
};

/* ---------- Toast ---------- */
let toastT=null;
function toast(msg){
  const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1600);
}

/* ---------- Init + service worker (offline) ---------- */
renderTabs(); renderSession();
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
